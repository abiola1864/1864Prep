[project]
name = "prep-1864"
version = "0.1.0"
description = "Local, deterministic, auditable data-standardisation engine for the Open Network on Digital ID."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The 1864 Research & Innovation Institute" }]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",            # legacy .xls files
    "python-dateutil>=2.8",
    "rapidfuzz>=3.0",
    "jellyfish>=1.0",
    "pdfplumber>=0.11",
    "charset-normalizer>=3.0",
    "ftfy>=6.0",
    "langdetect>=1.0",
    "phonenumbers>=8.13",
    "dateparser>=1.2",
    "babel>=2.12",
    "price-parser>=0.3",
    "email-validator>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.24",
    "pint>=0.22",
    "country_converter>=1.0",
    "pycountry>=24.0",
    "python-docx>=1.1",
    "lat-lon-parser>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
desktop = ["pywebview>=5.0", "pyinstaller>=6.0"]
semantic = ["sentence-transformers>=2.2", "model2vec>=0.3"]
names = ["names-dataset>=3.1"]
nlp = ["spacy>=3.7", "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"]   # optional local embeddings (meaning-based matching)

[project.scripts]
prep = "cli:main"

[tool.setuptools]
packages = ["engine", "engine.transforms"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
