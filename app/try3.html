    .container {

function updateSelectedFiltersDisplay() {
  const selectedFiltersContainer = document.querySelector(".selected-filters");
  selectedFiltersContainer.innerHTML = '';
  selectedFilters.forEach(filter => {
    const filterElement = document.createElement('div');
    filterElement.textContent = `${filter.type}: ${filter.option}`;
    selectedFiltersContainer.appendChild(filterElement);
  });
}
    
    
    

function filterConsultants() {
  console.log("Selected filters:", selectedFilters);
  const searchInput = document.querySelector(".search-container input");
  const searchTerm = searchInput.value.toLowerCase();

  fetch('consultants.json')
    .then(response => response.json())
    .then(consultants => {
      const filteredConsultants = consultants.filter(consultant => {
        const matchesFilters = selectedFilters.every(filter => {
          const consultantValue = consultant[filter.type];
          
          if (filter.type === "Gender") {
            console.log(`Consultant: ${consultant.Name}`);
            console.log(`Consultant Gender: "${consultantValue}", Filter Option: "${filter.option}"`);
            console.log(`Exact match: ${consultantValue === filter.option}`);
          }
          
          // For Gender, use exact match without lowercase conversion
          if (filter.type === "Gender") {
            return consultantValue === filter.option;
          }
          
          // For other filters, use the existing logic
          return Array.isArray(consultantValue)
            ? consultantValue.some(value => value.toLowerCase().includes(filter.option.toLowerCase()))
            : consultantValue.toLowerCase().includes(filter.option.toLowerCase());
        });

        const matchesSearch = Object.values(consultant).some(value => 
          value.toString().toLowerCase().includes(searchTerm)
        );

        return matchesFilters && matchesSearch;
      });

      console.log("Filtered consultants:", filteredConsultants);

      if (filteredConsultants.length === 0) {
        document.querySelector(".consultant-container").innerHTML = `
          <div class="no-results">
            <p>Sorry, no results match your search criteria <span class="emoji">🤔</span></p>
          </div>
        `;
      } else {
        renderConsultants(filteredConsultants);
      }
    })
    .catch(error => console.error('Error fetching consultants:', error));
}

function toggleDropdown(index) {
      const dropdownContents = document.querySelectorAll(".filter-container .dropdown-content");
      dropdownContents.forEach((content, i) => {
        if (i === index) {
          content.style.display = content.style.display === "block" ? "none" : "block";
        } else {
          content.style.display = "none";
        }
      });

      const dropdownArrows = document.querySelectorAll(".filter-container button .dropdown-arrow");
      dropdownArrows[index].textContent = dropdownArrows[index].textContent === "▼" ? "▲" : "▼";
    }
    
    
    
    
    
    
    
    


    
    
    function populateDropdownContent(consultants) {
  const filterGroups = document.querySelectorAll(".filter-container .filter-group");

  filterGroups.forEach((group, index) => {
    const button = group.querySelector("button");
    const dropdownContent = group.querySelector(".dropdown-content .dropdown-scroll");
    const type = ["Gender", "Specialist", "Able_To_Treat", "Condition", "Treatment", "Language"][index];

    group.setAttribute('data-type', type);

    let options;
    switch (type) {
      case "Gender":
        options = [...new Set(consultants.map(consultant => consultant.Gender))];
        console.log("Gender options:", options);
        break;
      case "Specialist":
        options = [...new Set(consultants.map(consultant => consultant.Specialist))];
        break;
      case "Able_To_Treat":
        options = [...new Set(consultants.map(consultant => consultant.Able_To_Treat))];
        break;
      case "Condition":
        options = [...new Set(consultants.map(consultant => consultant.Condition))];
        break;
      case "Treatment":
        options = [...new Set(consultants.map(consultant => consultant.Treatment))];
        break;
      case "Language":
        options = [...new Set(consultants.map(consultant => consultant.Language))];
        break;
    }

    options.forEach(option => {
      const optionElement = document.createElement("a");
      optionElement.textContent = option;
      optionElement.href = "#";
      optionElement.addEventListener("click", () => {
        toggleSelectedOption(type, option);
        filterConsultants();
      });
      dropdownContent.appendChild(optionElement);
    });

    button.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleDropdown(group);
    });
  });
}

    
  
    
    
    
function toggleDropdown(group) {
  const dropdownContent = group.querySelector(".dropdown-content");
  const arrow = group.querySelector(".dropdown-arrow");

  document.querySelectorAll(".filter-container .dropdown-content").forEach(content => {
    if (content !== dropdownContent) {
      content.style.display = "none";
      content.parentElement.querySelector(".dropdown-arrow").textContent = "▼";
    }
  });

  if (dropdownContent.style.display === "block") {
    dropdownContent.style.display = "none";
    arrow.textContent = "▼";
  } else {
    dropdownContent.style.display = "block";
    arrow.textContent = "▲";
  }
}

// Add this to close dropdowns when clicking outside
document.addEventListener("click", (event) => {
  if (!event.target.closest(".filter-container")) {
    document.querySelectorAll(".filter-container .dropdown-content").forEach(content => {
      content.style.display = "none";
      content.parentElement.querySelector(".dropdown-arrow").textContent = "▼";
    });
  }
});

    
    
    

document.querySelector(".search-container input").addEventListener("input", filterConsultants);


 function toggleSelectedOption(type, option) {
  console.log(`Toggling option: ${type} - ${option}`);
  const filterGroup = document.querySelector(`.filter-group[data-type="${type}"]`);
  const dropdownContent = filterGroup.querySelector('.dropdown-content');
  const selectedOption = filterGroup.querySelector('.selected-option');

  if (selectedOption) {
    selectedOption.remove();
    dropdownContent.style.display = 'block';
    // Remove the filter when unselecting
    updateSelectedFilters(type, null);
  } else {
    dropdownContent.style.display = 'none';
    const newSelectedOption = document.createElement('div');
    newSelectedOption.classList.add('selected-option');
    newSelectedOption.innerHTML = `
      ${option}
      <span class="close-button">×</span>
    `;
    newSelectedOption.querySelector('.close-button').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSelectedOption(type, option);
    });
    filterGroup.appendChild(newSelectedOption);
    // Add the filter when selecting
    updateSelectedFilters(type, option);
  }

  console.log("Calling filterConsultants");
  filterConsultants();
}

function updateSelectedFilters(type, option) {
  console.log(`Updating filters: ${type} - ${option}`);
  const index = selectedFilters.findIndex(filter => filter.type === type);
  if (index > -1) {
    if (option === null) {
      selectedFilters.splice(index, 1);
    } else {
      selectedFilters[index].option = option;
    }
  } else if (option !== null) {
    selectedFilters.push({ type, option });
  }
  console.log("Updated selectedFilters:", selectedFilters);
  updateResetButtonVisibility();
}
    
    
    
    
  
    

    
    
    
    
    
function updateResetButtonVisibility() {
  const resetButton = document.querySelector(".reset-button");
  if (selectedFilters.length > 0) {
    resetButton.style.display = "block";
  } else {
    resetButton.style.display = "none";
  }
}

    
// Add this function to handle the reset functionality
function resetFilters() {
  selectedFilters = [];
  document.querySelector(".selected-filters").innerHTML = "";
  updateResetButtonVisibility();
  filterConsultants();
}

// Add event listener to the "Reset All" button
document.querySelector(".reset-button").addEventListener("click", resetFilters);
