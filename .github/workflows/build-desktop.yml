name: Build desktop apps

# Build the offline 1864 Prep app for macOS and Windows on GitHub's free
# runners. Trigger from the Actions tab (Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: 1864Prep-macos
          - os: windows-latest
            artifact: 1864Prep-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,desktop]"
      - name: Build
        run: pyinstaller --noconfirm 1864Prep.spec
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
