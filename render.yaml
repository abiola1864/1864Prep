# Render deployment for the 1864 Prep demo (cloud test environment).
# This keeps the cloud demo in lockstep with the repo: every push to the
# connected branch rebuilds from this file, so what testers see == the code.
#
# NOTE: the demo is a hosted TEST environment. The real product is the local
# desktop app (data never leaves the machine). Keep only synthetic/sample data
# on the demo.
services:
  - type: web
    name: one864prep-demo
    runtime: python
    plan: free
    # install the engine + web extras (pulls all core deps from pyproject)
    buildCommand: "pip install --upgrade pip && pip install -e '.[web]'"
    # Render provides $PORT; bind 0.0.0.0 so the service is reachable
    startCommand: "uvicorn app.server:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true          # redeploy automatically on every push
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PREP_REGION
        value: "ng"
      - key: PREP_DEMO
        value: "1"          # hosted demo: start fresh each reload (no saved profile)
      # AI stays off on the demo unless a key is set here (leave unset = engine only)
      # - key: OPENAI_API_KEY
      #   value: ""
